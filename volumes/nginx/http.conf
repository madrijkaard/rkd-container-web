server {
    listen 80;
    server_name sinan-pro.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 'Aguardando o certificado HTTPS de sinan-pro.com.\n';
    }
}
