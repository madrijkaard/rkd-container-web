server {
    listen 80;
    server_name sinan-pro.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://sinan-pro.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sinan-pro.com;
    ssl_certificate /etc/letsencrypt/live/sinan-pro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sinan-pro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 5m;

    location ~ ^/(api|admin|static)(/|$) {
        set $backend http://rkd-backend:8000;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        set $frontend http://rkd-frontend:80;
        proxy_pass $frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
